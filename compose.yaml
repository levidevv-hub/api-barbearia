services:
  db:
    image: postgres:18
    restart: unless-stopped
    environment:
      POSTGRES_DB: barbearia
      POSTGRES_USER: barbearia
      POSTGRES_PASSWORD: ${DB_PASSWORD:?Configure DB_PASSWORD}
    volumes:
      - postgres_data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U barbearia -d barbearia"]
      interval: 10s
      timeout: 5s
      retries: 10
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

  app:
    build: .
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      DB_URL: jdbc:postgresql://db:5432/barbearia
      DB_USERNAME: barbearia
      DB_PASSWORD: ${DB_PASSWORD:?Configure DB_PASSWORD}
      WHATSAPP_TOKEN: ${WHATSAPP_TOKEN:?Configure WHATSAPP_TOKEN}
      WHATSAPP_VERIFY_TOKEN: ${WHATSAPP_VERIFY_TOKEN:?Configure WHATSAPP_VERIFY_TOKEN}
      META_APP_SECRET: ${META_APP_SECRET:?Configure META_APP_SECRET}
      BLOQUEIO_TESTE_CHAVE: ${BLOQUEIO_TESTE_CHAVE:?Configure BLOQUEIO_TESTE_CHAVE}
      TZ: America/Fortaleza
      JAVA_TOOL_OPTIONS: "-Xms128m -Xmx1024m -Duser.timezone=America/Fortaleza"
    ports:
      - "127.0.0.1:8080:8080"
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

volumes:
  postgres_data: