spring.application.name=barbearia-test

spring.datasource.url=jdbc:h2:mem:barbearia-test;MODE=PostgreSQL;DB_CLOSE_DELAY=-1
spring.datasource.username=sa
spring.datasource.password=
spring.jpa.hibernate.ddl-auto=create-drop

whatsapp.token=token-teste
